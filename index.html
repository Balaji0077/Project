<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Diwali — Festival of Lights</title>
  <meta name="description" content="Celebrate Diwali with lights, colors, sweets and joy. A simple single-file Diwali website with light/dark mode." />
  <style>
    :root{
      --bg:#0b1020;
      --card:#0f1724;
      --accent:#ffbf00;
      --muted:#9aa4b2;
      --text:#eef2ff;
    }
    [data-theme="light"]{
      --bg:#fff9e6;
      --card:#ffffff;
      --accent:#ff8800;
      --muted:#333;
      --text:#111;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,'Helvetica Neue',Arial;color:var(--text);background:var(--bg);transition:background 0.4s,color 0.4s;}
    header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem}
    .brand{display:flex;gap:.75rem;align-items:center}
    .logo{width:52px;height:52px;display:inline-grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--accent),#ff6b81);box-shadow:0 6px 24px rgba(255,191,0,0.08), inset 0 -3px 8px rgba(0,0,0,0.25)}
    .logo svg{display:block}
    h1.site-title{font-size:1.05rem;margin:0}
    p.tag{margin:0;color:var(--muted);font-size:.88rem}

    .container{max-width:1100px;margin:0 auto;padding:1rem}

    .card{background:var(--card);border-radius:14px;padding:1.25rem;box-shadow:0 4px 16px rgba(0,0,0,0.15);transition:background 0.4s;}
    .btn{padding:.65rem .9rem;border-radius:10px;border:0;cursor:pointer;font-weight:600;transition:background 0.3s,color 0.3s}
    .btn-primary{background:linear-gradient(90deg,var(--accent),#ff6b81);color:#fff;}
    .btn-ghost{background:transparent;color:var(--accent);border:1px solid rgba(255,191,0,0.3)}

    footer{text-align:center;color:var(--muted);margin:2rem 0}

    .toggle-mode{margin-left:.75rem;cursor:pointer;border:1px solid rgba(255,191,0,0.2);border-radius:8px;padding:.45rem .7rem;background:transparent;color:var(--accent);}
  </style>
</head>
<body>
  <header class="container">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 48 48" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M24 40c-6.627 0-12-3.582-12-8 0-2.93 2.686-5.518 7.046-6.786 2.25-.7 4.564-1.214 4.954-1.214.39 0 2.704.515 4.954 1.214C33.314 26.482 36 29.07 36 32c0 4.418-5.373 8-12 8z" fill="#ffcf66" /><path d="M30 20c0 3-6 6-6 6s-6-3-6-6a6 6 0 1112 0z" fill="#ff6b81"/></svg>
      </div>
      <div>
        <h1 class="site-title">Happy Diwali</h1>
        <p class="tag">Festival of Lights — now in Light & Dark mode</p>
      </div>
    </div>
    <div>
      <button class="btn btn-ghost" id="toggleMode">🌙 Toggle Mode</button>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2>Light every diya. Share every smile.</h2>
      <p>Celebrate Diwali your way — whether in bright daylight or glowing moonlight. Switch between light and dark themes anytime!</p>
    </div>
  </main>

  <footer class="container">
    <div class="card" style="display:inline-block;padding:.75rem 1rem">Made with ❤️ — Happy Diwali (Light/Dark Mode Feature Branch)</div>
  </footer>

  <script>
    const toggleModeBtn = document.getElementById('toggleMode');
    toggleModeBtn.addEventListener('click',()=>{
      const currentTheme = document.body.getAttribute('data-theme');
      if(currentTheme === 'light'){
        document.body.removeAttribute('data-theme');
        localStorage.setItem('theme','dark');
        toggleModeBtn.textContent = '🌙 Dark Mode';
      }else{
        document.body.setAttribute('data-theme','light');
        localStorage.setItem('theme','light');
        toggleModeBtn.textContent = '☀️ Light Mode';
      }
    });

    // On load restore last theme
    const savedTheme = localStorage.getItem('theme');
    if(savedTheme==='light'){
      document.body.setAttribute('data-theme','light');
      toggleModeBtn.textContent = '☀️ Light Mode';
    }
  </script>
</body>
</html>
